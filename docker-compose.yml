version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: roadsense-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: roadsense
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  stub-infer:
    image: python:3.10-slim
    container_name: roadsense-stub-infer
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn stub_infer:app --host 0.0.0.0 --port 8001 --reload"

volumes:
  postgres_data:
