version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.4

    container_name: roadsense-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: roadsense
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  stub-infer:
    image: python:3.10-slim
    container_name: roadsense-stub-infer
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn stub_infer:app --host 0.0.0.0 --port 8001 --reload"

  redis:
    image: redis:7-alpine
    container_name: roadsense-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    container_name: roadsense-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  redis_data:
  minio_data:
